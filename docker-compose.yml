services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sleeppilot
      POSTGRES_USER: sleeppilot
      POSTGRES_PASSWORD: sleeppilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sleeppilot:sleeppilot@db:5432/sleeppilot
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
